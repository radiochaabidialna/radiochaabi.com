(function(){
  try {
    var t = localStorage.getItem('chaabi_theme') || localStorage.getItem('rc_theme') || 'dark';
    var h = document.documentElement;
    h.classList.remove('dark','theme-ios','theme-light');

})();

<script>
/* Menu mobile + live-bar + thème + lecture — inline pour fiabilité */
(function(){
  var d = document, w = window;

  /* Menu mobile */
  var btn = d.getElementById('btn-menu');
  var menu = d.getElementById('mobile-menu');
  if (btn && menu) {
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      var open = menu.classList.toggle('open');
      menu.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      var ic = btn.querySelector('i');
      if (ic) ic.className = open ? 'fas fa-times' : 'fas fa-bars';
    });
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        menu.classList.remove('open','is-open');
        btn.setAttribute('aria-expanded','false');
        var ic = btn.querySelector('i');
        if (ic) ic.className = 'fas fa-bars';
      });
    });
    d.addEventListener('click', function(e){
      if (!menu.classList.contains('open')) return;
      if (menu.contains(e.target) || btn.contains(e.target)) return;
      menu.classList.remove('open','is-open');
      btn.setAttribute('aria-expanded','false');
      var ic = btn.querySelector('i');
      if (ic) ic.className = 'fas fa-bars';
    });
  }

  /* Live-bar: voir script dédié plus bas */
    /* Thème */
  var themeBtn = d.getElementById('btn-theme');
  function syncIcon(){
    if (!themeBtn) return;
    var h = d.documentElement, ic = themeBtn.querySelector('i');
    if (!ic) { ic = d.createElement('i'); themeBtn.appendChild(ic); }
    if (h.classList.contains('theme-ios')) ic.className = 'fas fa-wand-magic-sparkles';
    else if (h.classList.contains('theme-light')) ic.className = 'fas fa-moon';
    else ic.className = 'fas fa-sun';
  }
  syncIcon();
  if (themeBtn) themeBtn.addEventListener('click', function(){
    var h = d.documentElement;
    var cur = h.classList.contains('theme-ios') ? 'ios' : (h.classList.contains('theme-light') ? 'light' : 'dark');
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'ios' : 'dark');
    h.classList.remove('dark','theme-ios','theme-light');
    h.classList.add(next === 'dark' ? 'dark' : (next === 'ios' ? 'theme-ios' : 'theme-light'));
    try { localStorage.setItem('chaabi_theme', next); } catch(e){}
    syncIcon();
  });

  /* Mode lecture */
  var rb = d.getElementById('btn-reading-mode');
  function setReading(on){
    d.documentElement.classList.toggle('reading-mode', on);
    if (rb) { rb.textContent = on ? 'Quitter la lecture' : 'Mode lecture'; rb.setAttribute('aria-pressed', on?'true':'false'); }
    try { localStorage.setItem('chaabi_reading_mode', on?'1':'0'); } catch(e){}
  }
  if (rb) {
    try { setReading(localStorage.getItem('chaabi_reading_mode')==='1'); } catch(e){}
    rb.addEventListener('click', function(){ setReading(!d.documentElement.classList.contains('reading-mode')); });
  }
  d.addEventListener('keydown', function(e){
    if (e.key==='Escape' && d.documentElement.classList.contains('reading-mode')) setReading(false);
  });

  /* Back top */
  var topBtn = d.getElementById('back-to-top');
  if (topBtn) {
    w.addEventListener('scroll', function(){
      if (w.pageYOffset > 400) topBtn.classList.add('is-on'); else topBtn.classList.remove('is-on');
    }, {passive:true});
    topBtn.onclick = function(){ w.scrollTo({top:0,behavior:'smooth'}); };
  }
})();
</script>
<script>
// ── Live bar + Dédicaces (DYNAMIQUE — format radiochaabi réel) ──
(function () {
  'use strict';
  var API = (window.CHAABI_API || 'api/radiochaabi.php').split('?')[0];

  function qs(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function apiUrl(action) {
    return API + '?action=' + encodeURIComponent(action) + '&minutes=30&_=' + Date.now();
  }

  function mediaLabel(i) {
    if (!i || typeof i !== 'object') return '';
    var title = (i.title || i.titre || i.nom || i.name || i.label || i.last_title || '').toString().trim();
    var artist = (i.artist || i.artiste || i.artiste_nom || i.interprete || i.last_artist || '').toString().trim();
    var num = (i.numero != null ? i.numero : '').toString().trim();
    var invite = (i.invite || i.guest || '').toString().trim();
    var mt = (i.media_type || i.type || i.kind || i.categorie || 'chanson').toString().toLowerCase();

    if (mt.indexOf('emission') >= 0 || mt === 'show' || mt === 'programme') {
      var lab = '📻 Émission' + (num ? ' #' + num : '');
      if (invite) lab += ' — ' + invite;
      else if (title) lab += ' — ' + title;
      return lab;
    }
    if (mt.indexOf('interview') >= 0) {
      return '🎤 ' + (artist && title ? artist + ' — ' + title : (artist || title || 'Interview'));
    }
    if (artist && title) return '🎵 ' + title + ' — ' + artist;
    if (title) return '🎵 ' + title;
    if (artist) return '🎵 ' + artist;
    return '';
  }

  /** data[] + fallback radio.last_title / last_artist */
  function extractLiveLabels(d) {
    var parts = [];
    if (!d) return parts;

    // 1) data[] uniquement (comme qacidates.html)
    var arr = [];
    if (Array.isArray(d.data)) arr = d.data;
    else if (Array.isArray(d.items)) arr = d.items;
    else if (Array.isArray(d.live)) arr = d.live;
    else if (Array.isArray(d)) arr = d;

    for (var i = 0; i < arr.length; i++) {
      var lab = mediaLabel(arr[i]);
      if (lab) parts.push(lab);
    }

    // 2) radio SEULEMENT si data est vide (pas de mélange)
    if (!parts.length) {
      var radio = d.radio || null;
      if (radio && typeof radio === 'object') {
        var rt = (radio.last_title || radio.title || radio.titre || '').toString().trim();
        var ra = (radio.last_artist || radio.artist || radio.artiste || '').toString().trim();
        if (rt && ra) parts.push('🎵 ' + rt + ' — ' + ra);
        else if (rt) parts.push('🎵 ' + rt);
        else if (ra) parts.push('🎵 ' + ra);
      }
    }

    return parts;
  }

  function updateListenersFixed(d) {
    var n = (d && d.listeners != null) ? Number(d.listeners) : 0;
    var el = qs('live-listeners');
    if (!el) return;
    if (n > 0) {
      el.textContent = '👥 ' + n + ' auditeur' + (n > 1 ? 's' : '');
      el.hidden = false;
      el.style.display = '';
    } else {
      el.textContent = '';
      el.hidden = true;
    }
  }

  function paintTrack(labels) {
    var track = qs('live-bar-track');
    if (!track) return;
    var sep = ' <span style="opacity:.65;padding:0 14px">★</span> ';
    if (!labels.length) {
      var fb = '🎵 Chaabi Music — Radio en ligne ★ ';
      track.innerHTML = '<span>' + fb + '</span><span aria-hidden="true">' + fb + '</span>';
      track.removeAttribute('data-live');
      return;
    }
    var safe = labels.map(esc);
    var txt = safe.join(sep) + sep;
    track.innerHTML = '<span>' + txt + '</span><span aria-hidden="true">' + txt + '</span>';
    track.setAttribute('data-live', '1');
  }

  function updateLive() {
    if (!qs('live-bar-track')) return;
    fetch(apiUrl('get_live_bar'), { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (text) {
        var d;
        try { d = JSON.parse(text); } catch (e) { throw new Error('JSON'); }
        var labels = extractLiveLabels(d);
        paintTrack(labels);
        updateListenersFixed(d);
        if (window.console && console.debug) console.debug('[live-bar]', labels, d);
      })
      .catch(function (err) {
        if (window.console) console.warn('[live-bar]', err);
      });
  }

  function updateDedicaces() {
    var bar = qs('dedicaces-bar');
    var el = qs('dedicaces-ticker-items');
    if (!el) return;
    fetch(API + '?action=get_last_dedicaces&_=' + Date.now(), { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        var d;
        try { d = JSON.parse(text); } catch (e) { d = {}; }
        var list = [];
        if (Array.isArray(d.data)) list = d.data;
        else if (Array.isArray(d.dedicaces)) list = d.dedicaces;
        else if (Array.isArray(d.items)) list = d.items;

        if (!list.length) {
          el.innerHTML = '<span>✦ Aucune dédicace pour le moment</span>';
        } else {
          var html = list.map(function (x) {
            var from = x.nom || x.from || x.name || '';
            var to = x.pour || x.to || '';
            var msg = x.description || x.message || x.msg || '';
            return '<span>✦ <strong>' + esc(from) + '</strong>' +
              (to ? ' → ' + esc(to) : '') +
              (msg ? ' — ' + esc(msg) : '') + '</span>';
          }).join('');
          el.innerHTML = html + html;
        }
        if (bar) bar.classList.add('is-on');
      })
      .catch(function () {
        el.innerHTML = '<span>✦ Dédicaces indisponibles</span>';
        if (bar) bar.classList.add('is-on');
      });
  }

  function boot() {
    updateLive();
    updateDedicaces();
    setInterval(updateLive, 15000);
    setInterval(updateDedicaces, 40000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.chaabiRefreshBars = function () { updateLive(); updateDedicaces(); };
})();





</script>

<script>
/* Pont langue → footer (qacidates-v2) */
(function(){
  function applyFooterLang(lang) {
    lang = lang || (localStorage.getItem('chaabi_lang') || localStorage.getItem('rc_lang') || 'fr');
    if (typeof window.refreshFooter === 'function') {
      try { window.refreshFooter(lang); return; } catch(e) {}
      try { window.refreshFooter(); } catch(e) {}
    }
    if (typeof window.initFooter === 'function') {
      try { window.initFooter(lang); } catch(e) {}
    }
    var root = document.getElementById('footer-root');
    if (!root) return;
    root.setAttribute('data-lang', lang);
    root.querySelectorAll('[data-i18n-ar],[data-i18n-fr],[data-i18n]').forEach(function(el){
      var ar = el.getAttribute('data-i18n-ar');
      var fr = el.getAttribute('data-i18n-fr') || el.getAttribute('data-i18n');
      if (lang === 'ar' && ar) el.textContent = ar;
      else if (fr) el.textContent = fr;
    });
  }
  window.addEventListener('chaabi:langchange', function(ev){
    applyFooterLang(ev.detail && ev.detail.lang);
  });
  // Si footer.js se charge après, retenter
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){ applyFooterLang(); }, 400);
  });
})();
</script>
