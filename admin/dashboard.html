        <script>
        (function () {
            try {
                var t = localStorage.getItem('chaabi_admin_theme') || localStorage.getItem('chaabi_theme') || 'dark';
                if (t === 'ios') t = 'glass';
                if (t !== 'light' && t !== 'glass' && t !== 'dark') t = 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'light') document.documentElement.classList.remove('dark');
                else document.documentElement.classList.add('dark');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

        /* ═══ Thèmes admin : dark | light | glass (variables) ═══ */
        html[data-theme="dark"] {
            --adm-bg: #0d1117;
            --adm-bg2: #161b22;
            --adm-card: #161b22;
            --adm-border: #30363d;
            --adm-text: #e6edf3;
            --adm-muted: #8b949e;
            --adm-input: #0d1117;
            --adm-input-border: #30363d;
            --adm-aside: #010409;
            --adm-hover: rgba(255,255,255,.06);
            --adm-shadow: 0 8px 24px rgba(0,0,0,.4);
            --adm-primary: #2563eb;
            --adm-primary2: #1d4ed8;
            --adm-scroll: #3b82f6 #0d1117;
        }
        html[data-theme="light"] {
            --adm-bg: #f1f5f9;
            --adm-bg2: #ffffff;
            --adm-card: #ffffff;
            --adm-border: #e2e8f0;
            --adm-text: #0f172a;
            --adm-muted: #64748b;
            --adm-input: #f8fafc;
            --adm-input-border: #cbd5e1;
            --adm-aside: #ffffff;
            --adm-hover: rgba(15,23,42,.05);
            --adm-shadow: 0 4px 20px rgba(15,23,42,.08);
            --adm-primary: #2563eb;
            --adm-primary2: #1d4ed8;
            --adm-scroll: #2563eb #e2e8f0;
        }
        html[data-theme="glass"] {
            --adm-bg: #0b1220;
            --adm-bg2: rgba(22,27,34,.55);
            --adm-card: rgba(255,255,255,.06);
            --adm-border: rgba(255,255,255,.12);
            --adm-text: #e6edf3;
            --adm-muted: #94a3b8;
            --adm-input: rgba(255,255,255,.06);
            --adm-input-border: rgba(255,255,255,.14);
            --adm-aside: rgba(10,13,18,.72);
            --adm-hover: rgba(255,255,255,.08);
            --adm-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
            --adm-primary: #3b82f6;
            --adm-primary2: #2563eb;
            --adm-scroll: #3b82f6 #0b1220;
        }

        html { scrollbar-color: var(--adm-scroll); }
        body {
            background: var(--adm-bg) !important;
            color: var(--adm-text) !important;
            min-height: 100vh;
            transition: background .25s ease, color .2s ease;
        }
        html[data-theme="glass"] body {
            background:
                radial-gradient(ellipse 90% 50% at 50% -15%, rgba(37,99,235,.22), transparent 55%),
                var(--adm-bg) !important;
        }
        html[data-theme="light"] body {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 50%, #f1f5f9 100%) !important;
        }

        .card, .inv-card {
            background: var(--adm-card) !important;
            border: 1px solid var(--adm-border) !important;
            color: var(--adm-text) !important;
            border-radius: 16px;
            box-shadow: var(--adm-shadow);
        }
        html[data-theme="glass"] .card {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        html[data-theme="light"] .card,
        html[data-theme="dark"] .card {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .inp {
            width: 100%;
            background: var(--adm-input) !important;
            border: 1px solid var(--adm-input-border) !important;
            color: var(--adm-text) !important;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: .875rem;
            outline: none;
        }
        .inp:focus { border-color: var(--adm-primary) !important; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
        .inp::placeholder { color: var(--adm-muted); }
        .lbl { display: block; font-size: .72rem; font-weight: 700; color: var(--adm-muted) !important; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }

        .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; font-weight: 700; font-size: .83rem; padding: 8px 14px; transition: all .2s; cursor: pointer; border: none; }

        .btn-primary:hover { transform: translateY(-1px); }
        .btn-ghost { background: var(--adm-hover) !important; color: var(--adm-text) !important; border: 1px solid var(--adm-border); }
        .btn-ghost:hover { filter: brightness(1.08); }
        .btn-danger { background: rgba(239,68,68,.15); color: #f87171; }
        html[data-theme="light"] .btn-danger { color: #dc2626; background: rgba(239,68,68,.1); }

        .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }

    <script>
    const API = '_api.php';
    let VIEW = 'dashboard';
    let CUR_TABLE = null;
    let CUR_PAGE = 1;
    let CUR_Q = '';
    let CUR_TRASH = false;
    let EDIT_ID = 0;
    let CATS = [];
    let ARTISTS = [];
    let USERS = [];
    let EMS = [];
    let SONGS = [];
    let FORM_INVITES = [];   // invités du formulaire émission (état local)
    function api(path, data) {
        const opts = { method: data !== undefined ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
        if (data !== undefined) opts.body = JSON.stringify(data);
        // POST vide pour actions sans body
        if (data === undefined && path.indexOf('action=') >= 0) {
            opts.method = 'POST';
            opts.body = '{}';
        }
        return fetch(API + path, opts).then(async r => {
            const text = await r.text();
            let json = null;
            try { json = text ? JSON.parse(text) : {}; } catch (e) {
                throw { error: 'Réponse non-JSON (HTTP ' + r.status + ') — vérifiez _api.php / BDD', raw: text.slice(0, 200) };
            }
            if (r.status === 401) {
                showLogin();
                throw json.error ? json : { error: 'Session expirée — reconnectez-vous' };
            }
            if (!r.ok && json && json.error) throw json;
            return json;
        });
    }

    /* Chemin média → URL web. Toujours absolu (/music/...) : rien à modifier au déploiement */
    function mediaUrl(p) { if (!p) return ''; if (/^https?:/.test(p) || p.charAt(0) === '/') return p; return '/music/' + p.replace(/^music\//, ''); }
    function thumb(p) { const u = mediaUrl(p); return u ? '<img src="' + esc(u) + '" class="w-10 h-10 rounded-lg object-cover bg-[#0d1117]" onerror="this.style.visibility=\'hidden\'">' : '<div class="w-10 h-10 rounded-lg bg-[#21262d] flex items-center justify-center text-slate-500"><i class="fas fa-music"></i></div>'; }

    function renderCrud(rows, total, pages) {
        const cols = {

            bouqalla: ['N°', 'Arabe', 'Phonétique', 'Français', 'Actions']
        }[CUR_TABLE] || [];
        const th = cols.map(c => '<th>' + c + '</th>').join('');
        let tr = '';
        rows.forEach(r => {
            const stBadge = (v) => {
                const n = { published: 'Publié', draft: 'Brouillon', pending: 'En attente', rejected: 'Rejeté', new: 'Nouveau', read: 'Lu', archived: 'Archivé' }[v] || esc(v) || '—';
                const c = { published: 'badge-pub', draft: 'badge-draft', pending: 'badge-draft', rejected: 'badge-danger', new: 'badge-draft', read: 'badge-pub', archived: 'badge-ghost' }[v] || 'badge-ghost';
                return `<span class="badge ${c}"><i class="fas fa-circle text-[6px]"></i> ${n}</span>`;
            };
            const st = stBadge(r.status);
            const act = CUR_TRASH ? `
                <div class="flex gap-2">
                    <button onclick="restoreItem(${r.id})" class="btn btn-ghost !px-2.5 !py-1.5 text-xs text-emerald-400" title="Restaurer"><i class="fas fa-rotate-left"></i></button>
                    <button onclick="purgeItem(${r.id})" class="btn btn-danger !px-2.5 !py-1.5 text-xs" title="Effacer définitivement"><i class="fas fa-trash"></i></button>
                </div>` : `
                <div class="flex gap-2">
                    ${CUR_TABLE === 'chansons' ? `<button onclick="toggleFeatured(${r.id}, ${r.featured ? 0 : 1})" class="btn btn-ghost !px-2.5 !py-1.5 text-xs" title="${r.featured ? 'Retirer le coup de cœur' : 'Coup de cœur de la semaine'}">${r.featured ? '⭐' : '☆'}</button>` : ''}

                </div>`;
            const rowCls = CUR_TRASH ? 'opacity-60' : '';
            if (CUR_TABLE === 'artistes') tr += `<tr class="${rowCls}"><td>${thumb(r.image)}</td><td class="font-semibold text-white">${esc(r.nom)}<div class="text-xs text-slate-500">${esc(r.nom_ar || '')}</div></td><td>${esc(r.categorie_nom || '—')}</td><td>${st}</td><td>${act}</td></tr>`;

        if (pages > 1) {
            const win = 2; // numéros visibles autour de la page courante
            const arr = [];
            for (let p = 1; p <= pages; p++) if (p === 1 || p === pages || Math.abs(p - CUR_PAGE) <= win) arr.push(p);
            const btn = (p, label, cls) => `<button class="${cls}" ${p >= 1 && p <= pages ? `onclick="goPage(${p})"` : 'disabled'}>${label}</button>`;
            pager = btn(CUR_PAGE - 1, '‹', 'nav');

            arr.forEach(p => {
                if (last && p - last > 1) pager += `<span class="sep">…</span>`;
                pager += btn(p, p, p === CUR_PAGE ? 'on' : '');
                last = p;
            });
            pager += btn(CUR_PAGE + 1, '›', 'nav');
        }

       Chaque référentiel se charge indépendamment : si l'un échoue,
       les autres restent remplis + le message d'erreur exact s'affiche. */
    function loadRefs() {
        const jobs = [
            ['categories', api('?action=categories'), r => { CATS = r.data || []; }],
            ['artistes', api('?action=artistes&op=list&limit=500'), r => { ARTISTS = (r.data || []).map(x => ({ id: x.id, nom: x.nom })); }],
            ['animateurs', api('?action=animators'), r => { USERS = r.data || []; }],
            ['émissions', api('?action=emissions&op=list&limit=500'), r => { EMS = (r.data || []).map(x => ({ id: x.id, titre: x.titre, numero_emission: x.numero_emission })); }],
            ['chansons', api('?action=chansons&op=list&page=1&limit=500'), r => { SONGS = (r.data || []).map(x => ({ id: x.id, titre: x.titre, artiste_nom: x.artiste_nom })); }]
        ];
        return Promise.allSettled(jobs.map(j => j[1].then(r => {
            if (!r.ok) throw new Error((r.error || 'Erreur') + ' [' + j[0] + ']');
            j[2](r);
        }))).then(results => {
            const bad = results.filter(x => x.status === 'rejected');
            if (bad.length) {
                const msgs = bad.map(b => (b.reason && b.reason.message) || '?');
                console.error('Référentiels en échec :', msgs);
                toast('Référentiels en échec : ' + msgs.join(' | '), false);
            }
        });
    }

            const selEm = `<select id="f-emission_id" class="inp"><option value="">— Choisir une émission —</option>${EMS.map(e => `<option value="${e.id}">${esc(e.numero_emission ? 'N°' + e.numero_emission + ' — ' : '')}${esc(e.titre)}</option>`).join('')}</select>`;
            return {
                title: 'Commentaire d\'émission (modération)', fields: `
                    <div><label class="lbl">Émission *</label>${selEm}</div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="lbl">Nom *</label><input id="f-nom" class="inp" required></div>
                        <div><label class="lbl">Nom (arabe)</label><input id="f-nom_ar" class="inp" dir="rtl"></div>
                    </div>
                    <div><label class="lbl">Email</label><input id="f-email" type="email" class="inp"></div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="lbl">Message</label><textarea id="f-message" class="inp" rows="4"></textarea></div>
                        <div><label class="lbl">Message (arabe)</label><textarea id="f-message_ar" class="inp" rows="4" dir="rtl"></textarea></div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="lbl">Créé le</label><input id="f-created_at" type="datetime-local" class="inp"></div>
                        <div><label class="lbl">IP</label><input id="f-user_ip" class="inp" readonly></div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="lbl">Pays</label><input id="f-country" class="inp"></div>
                        <div><label class="lbl">Ville</label><input id="f-city" class="inp"></div>
                    </div>
                    <div><label class="lbl">Avatar (URL)</label><input id="f-avatar" class="inp" placeholder="https://…"></div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="lbl">Statut (modération)</label>${modSt()}</div>
                        <div><label class="lbl">Note de modération</label><input id="f-moderation_note" class="inp"></div>
                    </div>`
            };
        }
        if (CUR_TABLE === 'contacts') return {
            title: 'Contact', fields: `
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="lbl">Nom *</label><input id="f-nom" class="inp" required></div>
                    <div><label class="lbl">Email</label><input id="f-email" type="email" class="inp"></div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="lbl">Téléphone</label><input id="f-phone" class="inp"></div>
                    <div><label class="lbl">Sujet</label><input id="f-sujet" class="inp"></div>
                </div>
                <div><label class="lbl">Message</label><textarea id="f-message" class="inp" rows="4"></textarea></div>
                <div><label class="lbl">Statut</label><select id="f-admin_status" class="inp"><option value="new">Nouveau</option><option value="read">Lu</option><option value="archived">Archivé</option></select></div>`
        };
        if (CUR_TABLE === 'bouqalla') return {
            title: 'Bouqalla', fields: `
                <div><label class="lbl">Numéro (ordre)</label><input id="f-num" type="number" class="inp" placeholder="ex: 1"></div>
                <div><label class="lbl">Arabe *</label><textarea id="f-arabe" class="inp" rows="3" dir="rtl" required></textarea></div>
                <div><label class="lbl">Phonétique</label><textarea id="f-phonetic" class="inp" rows="2"></textarea></div>
                <div><label class="lbl">Français</label><textarea id="f-francais" class="inp" rows="2"></textarea></div>`
        };
        return {
            title: 'Interview', fields: `
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="lbl">Nom invité *</label><input id="f-artiste_nom" class="inp" required></div>
                    <div><label class="lbl">Nom (arabe)</label><input id="f-artiste_nom_ar" class="inp" dir="rtl"></div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="lbl">Artiste de la base</label>${selArt}</div>
                    <div><label class="lbl">Date de l'interview</label><input id="f-date_interview" type="datetime-local" class="inp"></div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="lbl">Durée</label><input id="f-duree" class="inp" placeholder="ex: 22:10"></div>
                    <div><label class="lbl">Statut</label>${stt()}</div>
                </div>
                ${upImg('f-image', 'img_interviews')}
                ${upAud('f-audio', 'audio_interviews')}
                ${seoBlock}`
        };
    }

    function catChanged() {
        const sel = document.getElementById('f-categorie_id');
        const opt = sel.options[sel.selectedIndex];
        const slug = opt ? opt.dataset.slug : '';
        const hint = document.getElementById('cat-target-hint');
        if (hint && slug) hint.innerHTML = '<i class="fas fa-folder mr-1"></i>dossiers : <code class="text-blue-400">/music/img_' + esc(slug) + '</code> / <code class="text-blue-400">/music/audio_' + esc(slug) + '</code>';
    }

    function openForm(id) {
        EDIT_ID = id || 0;
        const cfg = formFields();
        document.getElementById('modal-title').textContent = (EDIT_ID ? 'Modifier : ' : 'Ajouter : ') + cfg.title;
        document.getElementById('crud-form').innerHTML = cfg.fields + SAVE_BTN;
        if (CUR_TABLE === 'emissions') FORM_INVITES = [];
        if (!EDIT_ID) { document.getElementById('modal').classList.add('open'); renderInvites(); return; }
        api('?action=' + CUR_TABLE + '&op=get&id=' + EDIT_ID).then(r => {
            if (!r.ok) return err(r);
            const d = r.data;
            ['nom', 'nom_ar', 'pour', 'pour_ar', 'bio', 'bio_ar', 'titre', 'titre_ar', 'description', 'description_ar', 'message', 'message_ar', 'email', 'phone', 'sujet', 'artiste_nom', 'artiste_nom_ar', 'numero_emission', 'duree', 'image', 'audio', 'num', 'arabe', 'phonetic', 'francais', 'rating', 'moderation_note', 'slug', 'meta_title', 'meta_title_ar', 'meta_description', 'meta_description_ar'].forEach(k => {
                const el = document.getElementById('f-' + k);
                if (el) el.value = d[k] || '';
            });
            ['artiste_id', 'animateur_id', 'categorie_id', 'emission_id', 'chanson_id'].forEach(k => {
                const el = document.getElementById('f-' + k);
                if (el && d[k]) el.value = d[k];
            });
            const st = document.getElementById('f-status'); if (st && d.status) st.value = d.status;
            const ca = document.getElementById('f-admin_status'); if (ca && d.admin_status) ca.value = d.admin_status;
            const cda = document.getElementById('f-created_at'); if (cda && d.created_at) cda.value = d.created_at.replace(' ', 'T').slice(0, 16);
            const lk = document.getElementById('f-likes'); if (lk) lk.value = d.likes ?? 0;
            const ma = document.getElementById('f-moderated_at'); if (ma) ma.value = d.moderated_at || '';
            const mb = document.getElementById('f-moderated_by'); if (mb) mb.value = d.moderated_by ? (USERS.find(u => u.id == d.moderated_by)?.nom || '#' + d.moderated_by) : '';
            const uip = document.getElementById('f-user_ip'); if (uip) uip.value = d.user_ip || '';
            const dt = document.getElementById('f-date_emission'); if (dt && d.date_emission) dt.value = d.date_emission.replace(' ', 'T').slice(0, 16);
            const di = document.getElementById('f-date_interview'); if (di && d.date_interview) di.value = d.date_interview.replace(' ', 'T').slice(0, 16);
            ['f-image', 'f-audio'].forEach(k => {
                const name = document.getElementById(k + '-name');
                if (name) name.textContent = d[k] ? d[k].split('/').pop() : 'aucun fichier';
            });
            const ip = document.getElementById('f-image-prev');
            if (ip && d.image) ip.innerHTML = '<img src="' + esc(mediaUrl(d.image)) + '" class="w-full h-full object-cover">';
            const pl = document.getElementById('f-audio-player');
            if (pl && d.audio) pl.innerHTML = '<audio controls preload="none" src="' + esc(mediaUrl(d.audio)) + '" class="w-full h-8"></audio>';
            if (CUR_TABLE === 'emissions') {
                FORM_INVITES = (d.invites || []).map(iv => ({
                    id: iv.id, type: iv.artiste_id ? 'artiste' : 'externe',
                    artiste_id: iv.artiste_id || '', nom: iv.invite_externe_nom || '', nom_ar: iv.invite_externe_nom_ar || '',
                    type_ex: iv.invite_externe_type || '', type_ex_ar: iv.invite_externe_type_ar || '',
                    image: iv.invite_externe_image || '', bio: iv.invite_externe_bio || '', bio_ar: iv.invite_externe_bio_ar || '',
                    ordre: iv.ordre || 0
                }));
            }
            document.getElementById('modal').classList.add('open');
            renderInvites();
            catChanged();
        }).catch(err);
    }
    function closeForm() { document.getElementById('modal').classList.remove('open'); }

    /* ── Upload ── */
    function targetFor(kind) {
        if (CUR_TABLE === 'chansons') {
            const sel = document.getElementById('f-categorie_id');
            const slug = sel && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].dataset.slug : '';
            return (kind === 'img' ? 'img_' : 'audio_') + (slug || 'divers');
        }
        return kind + CUR_TABLE;
    }
    function upFile(input, target, hiddenId) {
        if (!input.files || !input.files[0]) return;
        // pour les chansons, on recalcule la cible réelle img_<cat> / audio_<cat>
        const real = target.startsWith('img_') || target.startsWith('audio_') ? targetFor(target.indexOf('audio_') === 0 ? 'audio' : 'img') : target;
        const fd = new FormData();
        fd.append('file', input.files[0]);
        fd.append('target', real);
        fetch(API + '?action=upload', { method: 'POST', body: fd })
            .then(r => r.json()).then(r => {
                if (!r.ok) return toast(r.error || 'Upload échoué', false);
                document.getElementById(hiddenId).value = r.path;
                const prev = document.getElementById(hiddenId + '-prev');
                if (prev) prev.innerHTML = '<img src="' + esc(r.path) + '" class="w-full h-full object-cover">';
                const name = document.getElementById(hiddenId + '-name');
                if (name) name.textContent = r.path.split('/').pop();
                const pl = document.getElementById(hiddenId + '-player');
                if (pl) pl.innerHTML = '<audio controls preload="none" src="' + esc(r.path) + '" class="w-full h-8"></audio>';
                toast('Fichier uploadé : ' + r.path);
                input.value = '';
            }).catch(() => toast('Upload échoué', false));
    }

    /* ── Invités (émission) ── */
    function addInvite(type) {
        FORM_INVITES.push({ id: 0, type, artiste_id: '', nom: '', nom_ar: '', type_ex: '', type_ex_ar: '', image: '', bio: '', bio_ar: '', ordre: FORM_INVITES.length });
        renderInvites();
    }
    function renderInvites() {
        const c = document.getElementById('invites-container');
        if (!c) return;
        c.innerHTML = FORM_INVITES.map((iv, i) => `
            <div class="inv-card">
                <div class="flex items-center justify-between mb-2">
                    <span class="badge ${iv.type === 'artiste' ? 'badge-pub' : 'badge-draft'}"><i class="fas ${iv.type === 'artiste' ? 'fa-user' : 'fa-globe'}"></i> ${iv.type === 'artiste' ? 'Artiste interne' : 'Invité externe'}</span>
                    <button type="button" class="text-red-400 hover:text-red-300" onclick="delInvite(${i})"><i class="fas fa-trash"></i></button>
                </div>
                ${iv.type === 'artiste'
                    ? `<div class="grid md:grid-cols-2 gap-3">
                        <div><label class="lbl">Artiste</label><select data-i="${i}" data-field="artiste_id" class="inp" onchange="invSet(this)"><option value="">— Choisir —</option>${ARTISTS.map(a => `<option value="${a.id}" ${String(a.id) === String(iv.artiste_id) ? 'selected' : ''}>${esc(a.nom)}</option>`).join('')}</select></div>
                        <div><label class="lbl">Ordre</label><input data-i="${i}" data-field="ordre" type="number" class="inp" value="${iv.ordre}" onchange="invSet(this)"></div>
                      </div>`
                    : `<div class="grid md:grid-cols-2 gap-3">
                        <div><label class="lbl">Nom</label><input data-i="${i}" data-field="nom" class="inp" value="${esc(iv.nom)}" oninput="invSet(this)"></div>
                        <div><label class="lbl">Nom (arabe)</label><input data-i="${i}" data-field="nom_ar" class="inp" dir="rtl" value="${esc(iv.nom_ar)}" oninput="invSet(this)"></div>
                        <div><label class="lbl">Type (ex: poète)</label><input data-i="${i}" data-field="type_ex" class="inp" value="${esc(iv.type_ex)}" oninput="invSet(this)"></div>
                        <div><label class="lbl">Type (arabe)</label><input data-i="${i}" data-field="type_ex_ar" class="inp" dir="rtl" value="${esc(iv.type_ex_ar)}" oninput="invSet(this)"></div>
                        <div class="md:col-span-2"><label class="lbl">Bio</label><textarea data-i="${i}" data-field="bio" class="inp" rows="2" oninput="invSet(this)">${esc(iv.bio)}</textarea></div>
                        <div class="md:col-span-2">
                            <label class="lbl">Image (invité externe)</label>
                            <div class="flex items-center gap-3">
                                <div id="inv-img-${i}" class="w-11 h-11 rounded-lg overflow-hidden bg-[#0d1117] border border-[#2a313c] flex items-center justify-center text-slate-600 shrink-0">${iv.image ? '<img src="' + esc(mediaUrl(iv.image)) + '" class="w-full h-full object-cover">' : '<i class="fas fa-user"></i>'}</div>
                                <input type="file" accept="image/*" class="inp !py-1.5 flex-1" onchange="upInviteFile(this, ${i})">
                            </div>
                        </div>
                      </div>`}
            </div>`).join('') || '<p class="text-xs text-slate-600 italic">Aucun invité — ajoutez un artiste interne ou un invité externe.</p>';
    }
    function invSet(el) {
        const iv = FORM_INVITES[+el.dataset.i];
        if (!iv) return;
        const f = el.dataset.field;
        iv[f] = el.value;
        if (f === 'ordre') iv.ordre = parseInt(el.value || '0', 10);
    }
    function delInvite(i) {
        const iv = FORM_INVITES[i];
        if (iv && iv.id) {
            api('?action=emission_invites&op=delete&id=' + iv.id).then(() => { FORM_INVITES.splice(i, 1); renderInvites(); }).catch(err);
        } else { FORM_INVITES.splice(i, 1); renderInvites(); }
    }
    function upInviteFile(input, i) {
        if (!input.files || !input.files[0]) return;
        const fd = new FormData();
        fd.append('file', input.files[0]);
        fd.append('target', 'img_invites');
        fetch(API + '?action=upload', { method: 'POST', body: fd })
            .then(r => r.json()).then(r => {
                if (!r.ok) return toast(r.error || 'Upload échoué', false);
                FORM_INVITES[i].image = r.path;
                const prev = document.getElementById('inv-img-' + i);
                if (prev) prev.innerHTML = '<img src="' + esc(r.path) + '" class="w-full h-full object-cover">';
                toast('Image invité uploadée');
                input.value = '';
            }).catch(() => toast('Upload échoué', false));
    }

    /* ── Sauvegarde ── */
    function saveForm(e) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('[type="submit"]');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.dataset._old = submitBtn.innerHTML; submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement…'; }
        const _unlock = () => { if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = submitBtn.dataset._old || 'Enregistrer'; } };
        const data = {};
        ['nom', 'nom_ar', 'pour', 'pour_ar', 'bio', 'bio_ar', 'titre', 'titre_ar', 'description', 'description_ar', 'message', 'message_ar', 'email', 'phone', 'sujet', 'artiste_nom', 'artiste_nom_ar', 'numero_emission', 'duree', 'image', 'audio', 'artiste_id', 'animateur_id', 'categorie_id', 'emission_id', 'status', 'admin_status', 'num', 'arabe', 'phonetic', 'francais', 'rating', 'moderation_note', 'slug', 'meta_title', 'meta_title_ar', 'meta_description', 'meta_description_ar', 'country', 'city', 'avatar'].forEach(k => {
            const el = document.getElementById('f-' + k);
            if (el) data[k] = el.value;
        });
        const dt = document.getElementById('f-date_emission');
        if (dt) data.date_emission = dt.value ? dt.value.replace('T', ' ') + ':00' : null;
        const di = document.getElementById('f-date_interview');
        if (di) data.date_interview = di.value ? di.value.replace('T', ' ') + ':00' : null;
        const cda = document.getElementById('f-created_at');
        if (cda) data.created_at = cda.value ? cda.value.replace('T', ' ') + ':00' : null;
        if (CUR_TABLE === 'dedicaces' || CUR_TABLE === 'commentaires' || CUR_TABLE === 'emission_comments') data.status = data.status || 'pending';
        else if (CUR_TABLE === 'contacts') data.admin_status = data.admin_status || 'new';
        else data.status = data.status || 'draft';
        const payload = { id: EDIT_ID, data };
        api('?action=' + CUR_TABLE + '&op=save', payload).then(async r => {
            if (!r.ok) { _unlock(); return err(r); }
            if (CUR_TABLE === 'emissions' && EDIT_ID === 0) EDIT_ID = r.id; // invités rattachés ensuite
            if (CUR_TABLE === 'emissions') {
                await saveInvites(r.id);
            }
            toast(CUR_TABLE === 'emissions' ? 'Émission enregistrée ✓' : 'Enregistré ✓');
            closeForm();
            loadCrud();
        }).catch(e => { _unlock(); err(e); });
    }
    async function saveInvites(emissionId) {
        for (const iv of FORM_INVITES) {
            const data = {
                emission_id: emissionId,
                ordre: iv.ordre || 0,
                artiste_id: iv.type === 'artiste' ? (iv.artiste_id || null) : null,
                invite_externe_nom: iv.type === 'externe' ? (iv.nom || '') : null,
                invite_externe_nom_ar: iv.type === 'externe' ? (iv.nom_ar || null) : null,
                invite_externe_type: iv.type === 'externe' ? (iv.type_ex || null) : null,
                invite_externe_type_ar: iv.type === 'externe' ? (iv.type_ex_ar || null) : null,
                invite_externe_image: iv.type === 'externe' ? (iv.image || null) : null,
                invite_externe_bio: iv.type === 'externe' ? (iv.bio || null) : null,
                invite_externe_bio_ar: iv.type === 'externe' ? (iv.bio_ar || null) : null
            };
            const res = await api('?action=emission_invites&op=save', { id: iv.id || 0, data });
            if (!res.ok) throw res;
        }
    }


    /* ── Raccourcis clavier admin ── */
    document.addEventListener('keydown', function (ev) {
        var tag = (ev.target && ev.target.tagName) || '';
        var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ev.target && ev.target.isContentEditable);
        // Échap : fermer modal / menu mobile
        if (ev.key === 'Escape') {
            var modal = document.getElementById('modal');
            if (modal && modal.classList.contains('open')) { closeForm(); return; }
            var mn = document.getElementById('mobile-nav');
            if (mn && !mn.classList.contains('hidden')) mn.classList.add('hidden');
        }
        // Ctrl/Cmd + K : focus recherche
        if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') {
            ev.preventDefault();
            var s = document.getElementById('crud-search');
            if (s && !document.getElementById('view-crud').classList.contains('hidden')) { s.focus(); s.select(); }
        }
        // Ctrl/Cmd + S : sauver formulaire ouvert
        if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') {
            var modal = document.getElementById('modal');
            if (modal && modal.classList.contains('open')) {
                ev.preventDefault();
                var form = document.getElementById('crud-form');
                if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        }
        // Ctrl/Cmd + N : nouvel élément (si pas en train de taper)
        if (!typing && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'n') {
            if (!document.getElementById('view-crud').classList.contains('hidden')) {
                ev.preventDefault();
                openForm();
            }
        }
    });
    // admin-shortcuts
    </script>
</body>
