<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1428">
  <title>Hors ligne — Radio Chaabi</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #1a1428, #2a1830 50%, #1a2e28);
      color: #fef3c7; text-align: center; padding: 1.5rem;
    }
    .card {
      max-width: 420px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(245,185,66,0.35); border-radius: 20px;
      padding: 2rem 1.5rem; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #e8d5b5; line-height: 1.5; }
    a.btn {
      display: inline-block; margin-top: 1rem; padding: 0.75rem 1.4rem;
      background: linear-gradient(135deg, #f5b942, #d97706); color: #1a1008;
      font-weight: 700; border-radius: 999px; text-decoration: none;
    }
    .ar { font-family: serif; direction: rtl; margin-top: 1rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:2.5rem;margin-bottom:0.5rem">📻</div>
    <h1>Radio Chaabi</h1>
    <p>Vous êtes <strong>hors ligne</strong>.<br>
    Vérifiez votre connexion Internet, puis réessayez.</p>
    <p class="ar">أنت غير متصل بالإنترنت. تحقق من الشبكة ثم أعد المحاولة.</p>
    <a class="btn" href="index.html" onclick="location.reload();return false;">Réessayer / إعادة المحاولة</a>
  </div>
</body>
</html>
